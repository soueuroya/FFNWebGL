name: Deploy Unity WebGL to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Verify Unity WebGL files
        run: |
          echo "=== Build files ==="
          ls -lh Build/

          echo ""
          echo "=== Loader ==="
          head -c 100 Build/*.loader.js
          echo ""

          echo ""
          echo "=== Checking for LFS pointers ==="

          if grep -q "git-lfs.github.com/spec/v1" Build/*.loader.js; then
            echo "ERROR: loader.js is an LFS pointer!"
            exit 1
          fi

          if grep -q "git-lfs.github.com/spec/v1" Build/*.data; then
            echo "ERROR: data file is an LFS pointer!"
            exit 1
          fi

          if grep -q "git-lfs.github.com/spec/v1" Build/*.wasm; then
            echo "ERROR: wasm file is an LFS pointer!"
            exit 1
          fi

          echo "All Unity WebGL files are real files."

      - name: Disable Jekyll
        run: |
          touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
