name: Deploy Unity WebGL to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify WebGL build
        run: |
          echo "=== Build files ==="
          ls -lh Build/

          echo ""
          echo "=== Largest files ==="
          du -h Build/* | sort -h

          echo ""
          echo "=== Checking loader ==="
          head -c 200 Build/*.loader.js

      - name: Verify deployed files are not LFS pointers
        run: |
          echo "=== Checking loader ==="
          if grep -q "git-lfs.github.com/spec/v1" Build/*.loader.js; then
            echo "ERROR: loader.js is still an LFS pointer!"
            cat Build/*.loader.js
            exit 1
          else
            echo "OK: loader.js is real JavaScript"
          fi

          echo ""
          echo "=== Checking data file ==="
          if grep -q "git-lfs.github.com/spec/v1" Build/*.data; then
            echo "ERROR: data file is still an LFS pointer!"
            exit 1
          else
            echo "OK: data file is real"
          fi

          echo ""
          echo "=== Checking wasm ==="
          if grep -q "git-lfs.github.com/spec/v1" Build/*.wasm; then
            echo "ERROR: wasm is still an LFS pointer!"
            exit 1
          else
            echo "OK: wasm is real"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload WebGL site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
